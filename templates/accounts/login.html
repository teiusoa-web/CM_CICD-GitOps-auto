{% extends "base.html" %}
{% block title %}Đăng nhập · DevDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Đăng nhập DevDesk</h1>
        <form method="post">
          {% csrf_token %}
          {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Tên đăng nhập</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Mật khẩu</label>
            {{ form.password }}
          </div>
          <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
        </form>
        <p class="mt-3 mb-0 text-muted">Chưa có tài khoản? <a href="{% url 'accounts:register' %}">Đăng ký</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
